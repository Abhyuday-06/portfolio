<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Multiscale wavelet sparsity illustration</title>
  <desc id="desc">A stylized piecewise signal above sparse coefficient bars at three scales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c31"/>
      <stop offset="1" stop-color="#202545"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77e4d0"/>
      <stop offset="1" stop-color="#8a9bff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="615" rx="22" fill="url(#grid)" stroke="#b4c5ff" stroke-opacity=".12"/>
  <text x="76" y="92" fill="#eff3ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">WAVELET SPARSITY</text>
  <text x="76" y="126" fill="#aab7d2" font-family="Segoe UI, Arial, sans-serif" font-size="17">Multiscale signal representation</text>
  <rect x="934" y="64" width="178" height="42" rx="21" fill="#293658" stroke="#7182c4" stroke-opacity=".38"/>
  <text x="1023" y="91" text-anchor="middle" fill="#c9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">HAAR BASIS</text>

  <text x="82" y="184" fill="#94a4c3" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.6">SIGNAL</text>
  <rect x="76" y="202" width="1048" height="196" rx="15" fill="#10192b" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
  <path d="M112 350H1110M112 238V370" fill="none" stroke="#7887a8" stroke-opacity=".48" stroke-width="2"/>
  <path d="M112 278H1110M112 322H1110" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" stroke-dasharray="5 8"/>
  <path d="M115 333 C165 330 190 310 226 305 L300 305 L300 265 L422 265 L422 300 L530 300 L530 246 L658 246 L658 286 L773 286 L773 235 L904 235 L904 282 L1012 282 C1050 280 1072 266 1108 250" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="265" r="6" fill="#77e4d0"/>
  <circle cx="530" cy="246" r="6" fill="#86c5eb"/>
  <circle cx="773" cy="235" r="6" fill="#8a9bff"/>
  <circle cx="904" cy="282" r="6" fill="#c38df5"/>

  <text x="82" y="454" fill="#94a4c3" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.6">SPARSE COEFFICIENTS BY SCALE</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="76" y="472" width="318" height="122" rx="15" fill="#151f34" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="101" y="505" fill="#aab7d2" font-size="15">COARSE</text>
    <path d="M104 565H366" stroke="#667493" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#8a9bff"><rect x="130" y="534" width="22" height="31" rx="5"/><rect x="178" y="552" width="22" height="13" rx="5"/><rect x="274" y="521" width="22" height="44" rx="5"/><rect x="322" y="546" width="22" height="19" rx="5"/></g>

    <rect x="441" y="472" width="318" height="122" rx="15" fill="#151f34" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="466" y="505" fill="#aab7d2" font-size="15">MID SCALE</text>
    <path d="M469 565H731" stroke="#667493" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#77e4d0"><rect x="494" y="542" width="16" height="23" rx="4"/><rect x="526" y="558" width="16" height="7" rx="4"/><rect x="590" y="522" width="16" height="43" rx="4"/><rect x="622" y="552" width="16" height="13" rx="4"/><rect x="686" y="534" width="16" height="31" rx="4"/></g>

    <rect x="806" y="472" width="318" height="122" rx="15" fill="#151f34" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="831" y="505" fill="#aab7d2" font-size="15">FINE</text>
    <path d="M834 565H1096" stroke="#667493" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#c38df5"><rect x="858" y="551" width="12" height="14" rx="4"/><rect x="884" y="558" width="12" height="7" rx="4"/><rect x="936" y="539" width="12" height="26" rx="4"/><rect x="962" y="557" width="12" height="8" rx="4"/><rect x="1014" y="526" width="12" height="39" rx="4"/><rect x="1040" y="552" width="12" height="13" rx="4"/><rect x="1080" y="545" width="12" height="20" rx="4"/></g>
  </g>
  <text x="76" y="623" fill="#71809f" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.1">MULTISCALE VIEW · COARSE TO FINE</text>
</svg>

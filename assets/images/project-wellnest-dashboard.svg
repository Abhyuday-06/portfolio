<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">WellNest student dashboard illustration</title>
  <desc id="desc">A student well-being dashboard with assessment, counselor support, and check-in history panels.</desc>
  <defs>
    <linearGradient id="welcome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#27364d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#eef0f3"/>
  <rect x="30" y="28" width="1140" height="619" rx="23" fill="#f7f8fa" stroke="#dfe4e8" stroke-width="2"/>
  <path d="M53 28h1094a23 23 0 0 1 23 23v50H30V51a23 23 0 0 1 23-23Z" fill="#284f12"/>
  <circle cx="68" cy="76" r="8" fill="#93b77a"/>
  <text x="91" y="83" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">WellNest</text>
  <text x="224" y="82" fill="#e7efdf" font-family="Segoe UI, Arial, sans-serif" font-size="15">Student wellness</text>
  <text x="1014" y="81" fill="#e7efdf" font-family="Segoe UI, Arial, sans-serif" font-size="14">Dashboard</text>
  <circle cx="1117" cy="74" r="17" fill="#52733b"/>
  <circle cx="1117" cy="69" r="5" fill="#e8f0df"/>
  <path d="M1107 83c2-7 18-7 20 0" fill="none" stroke="#e8f0df" stroke-width="3" stroke-linecap="round"/>

  <rect x="63" y="118" width="1074" height="173" rx="20" fill="url(#welcome)" filter="url(#shadow)"/>
  <text x="103" y="169" fill="#e8eaff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">YOUR WELLBEING, AT YOUR PACE</text>
  <text x="103" y="216" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Welcome to WellNest</text>
  <text x="103" y="251" fill="#f0efff" font-family="Segoe UI, Arial, sans-serif" font-size="18">Check in on your mental well-being and connect with support.</text>
  <circle cx="1054" cy="203" r="42" fill="#ffffff" fill-opacity=".14"/>
  <path d="M1034 208c0-13 9-22 22-22 12 0 22 9 22 21 0 13-10 23-24 23-5 0-10-2-14-5l-11 3 4-11c-1-3-1-6-1-9Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1045 207h21M1045 215h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <text x="66" y="333" fill="#465166" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Choose a next step</text>
  <g filter="url(#shadow)">
    <rect x="64" y="352" width="518" height="130" rx="16" fill="#fff" stroke="#e5e8ed"/>
    <rect x="91" y="380" width="72" height="72" rx="18" fill="#edf0ff"/>
    <path d="M112 397h29v38h-29z" fill="none" stroke="#667eea" stroke-width="3" stroke-linejoin="round"/>
    <path d="M118 406h17M118 414h17M118 422h12" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <text x="187" y="405" fill="#353e51" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Take Assessment</text>
    <text x="187" y="435" fill="#737d8e" font-family="Segoe UI, Arial, sans-serif" font-size="15">A quick, private check-in on how you feel.</text>
    <path d="m532 409 10 10-10 10" fill="none" stroke="#858e9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="600" y="352" width="536" height="130" rx="16" fill="#fff" stroke="#e5e8ed"/>
    <rect x="627" y="380" width="72" height="72" rx="18" fill="#e7f4ee"/>
    <path d="M646 402c0-7 6-12 14-12s14 5 14 12-6 12-14 12c-2 0-5 0-7-1l-8 3 3-7c-1-2-2-4-2-7Z" fill="none" stroke="#4a9a72" stroke-width="3" stroke-linejoin="round"/>
    <text x="723" y="405" fill="#353e51" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Chat with Counselor</text>
    <text x="723" y="435" fill="#737d8e" font-family="Segoe UI, Arial, sans-serif" font-size="15">Find support and talk with someone who can help.</text>

  <circle cx="330" cy="583" r="14" fill="#f0f1ff"/>
  <path d="M324 583h12M330 577v12" stroke="#737ee4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="358" y="588" fill="#7b8493" font-family="Segoe UI, Arial, sans-serif" font-size="15">Your check-ins will appear here as you use WellNest.</text>
